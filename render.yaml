services:
  - type: web
    name: waselni-backend1997
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: waselni-backend1997.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
